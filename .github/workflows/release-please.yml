name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38  # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The repo-scoped GITHUB_TOKEN has the declared contents/pull-request write
          # permissions. GH_TOKEN is an externally managed PAT and lacks Git Database
          # access, which prevents release-please from creating its release commit tree.
          token: ${{ github.token }}
