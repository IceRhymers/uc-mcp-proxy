name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38  # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GH_TOKEN is Tanner's repository-scoped PAT. Its user identity is the
          # only bypass actor allowed to create protected v* release tags.
          token: ${{ secrets.GH_TOKEN }}
